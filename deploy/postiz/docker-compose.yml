# Self-hosted Postiz next to the factory. Based on the official compose from
# https://docs.postiz.com/installation/docker-compose — check that page when
# upgrading; env names below are the ones the app reads today.
#
#   cp deploy/postiz/.env.example deploy/postiz/.env   # fill in domain + secrets
#   docker compose --env-file deploy/postiz/.env -f deploy/postiz/docker-compose.yml up -d
#   open https://<POSTIZ_DOMAIN>  -> create the owner account, connect channels,
#   Settings -> Public API -> copy the key into the factory's .env (POSTIZ_API_KEY)
#
# The factory calls http://localhost:5000/api/public/v1 (same box). Instagram/TikTok
# fetch media FROM Postiz, so Postiz itself must be reachable on a public HTTPS
# domain (Caddy/nginx in front of :5000) even though the factory talks to it locally.
services:
  postiz:
    image: ghcr.io/gitroomhq/postiz-app:latest
    container_name: postiz
    restart: always
    environment:
      MAIN_URL: "https://${POSTIZ_DOMAIN}"
      FRONTEND_URL: "https://${POSTIZ_DOMAIN}"
      NEXT_PUBLIC_BACKEND_URL: "https://${POSTIZ_DOMAIN}/api"
      BACKEND_INTERNAL_URL: "http://localhost:3000"
      JWT_SECRET: "${POSTIZ_JWT_SECRET}"
      DATABASE_URL: "postgresql://postiz:${POSTIZ_DB_PASSWORD}@postiz-postgres:5432/postiz"
      REDIS_URL: "redis://postiz-redis:6379"
      IS_GENERAL: "true"
      DISABLE_REGISTRATION: "${POSTIZ_DISABLE_REGISTRATION:-false}"
      STORAGE_PROVIDER: "local"
      UPLOAD_DIRECTORY: "/uploads"
      NEXT_PUBLIC_UPLOAD_DIRECTORY: "/uploads"
      # Provider OAuth apps (fill the ones you connect; leave others empty)
      YOUTUBE_CLIENT_ID: "${YOUTUBE_CLIENT_ID:-}"
      YOUTUBE_CLIENT_SECRET: "${YOUTUBE_CLIENT_SECRET:-}"
      INSTAGRAM_APP_ID: "${INSTAGRAM_APP_ID:-}"
      INSTAGRAM_APP_SECRET: "${INSTAGRAM_APP_SECRET:-}"
      FACEBOOK_APP_ID: "${FACEBOOK_APP_ID:-}"
      FACEBOOK_APP_SECRET: "${FACEBOOK_APP_SECRET:-}"
      TIKTOK_CLIENT_ID: "${TIKTOK_CLIENT_ID:-}"
      TIKTOK_CLIENT_SECRET: "${TIKTOK_CLIENT_SECRET:-}"
      TELEGRAM_BOT_NAME: "${TELEGRAM_BOT_NAME:-}"
      TELEGRAM_TOKEN: "${TELEGRAM_TOKEN:-}"
      VK_CLIENT_ID: "${VK_CLIENT_ID:-}"
      VK_CLIENT_SECRET: "${VK_CLIENT_SECRET:-}"
    volumes:
      - postiz-config:/config
      - postiz-uploads:/uploads
    ports:
      - "127.0.0.1:5000:5000"
    depends_on:
      postiz-postgres:
        condition: service_healthy
      postiz-redis:
        condition: service_healthy

  postiz-postgres:
    image: postgres:17-alpine
    container_name: postiz-postgres
    restart: always
    environment:
      POSTGRES_PASSWORD: "${POSTIZ_DB_PASSWORD}"
      POSTGRES_USER: postiz
      POSTGRES_DB: postiz
    volumes:
      - postiz-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postiz -d postiz"]
      interval: 10s
      timeout: 3s
      retries: 5

  postiz-redis:
    image: redis:7.2-alpine
    container_name: postiz-redis
    restart: always
    volumes:
      - postiz-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  postiz-config:
  postiz-uploads:
  postiz-postgres:
  postiz-redis:
